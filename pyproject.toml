[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "basketbrief"
version = "0.1.0"
description = "Field evidence followed through to approved donor reports. Built with Strands Agents."
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "strands-agents==1.55.1",
  "botocore[crt]",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
  "pillow>=11,<13",
  "pypdfium2>=4,<6",
  "cryptography>=44",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["basketbrief*"]

[tool.setuptools.package-data]
basketbrief = ["static/*", "static/**/*", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["basketbrief"]
